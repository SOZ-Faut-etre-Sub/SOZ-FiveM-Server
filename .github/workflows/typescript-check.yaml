name: "Check Typescript"

on:
    pull_request: ~

jobs:
    check-typescript:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3
            - uses: bahmutov/npm-install@v1
              with:
                  working-directory: "resources/[soz]/soz-core"
            - name: "check-typescript"
              working-directory: "resources/[soz]/soz-core"
              run: yarn run tsc -p tsconfig.json --noEmit
