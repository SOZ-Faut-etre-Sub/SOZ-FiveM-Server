<html>
    <head>
        <!-- Need to include jQuery! -->
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.1.1/howler.min.js" type="text/javascript"></script>
        <script>
            let audioLoopPlayer = {};
            window.addEventListener('message', function(event) {
                // Check for playSound transaction
                if (event.data.transactionType === "playSound") {
                    if (event.data.transactionFile.startsWith("http")) {
                        let audioPlayer = new Howl({src: [event.data.transactionFile]});
                        audioPlayer.volume(event.data.transactionVolume);
                        audioPlayer.play();
                    } else {
                        let audioPlayer = new Howl({src: ["./sounds/" + event.data.transactionFile + ".ogg"]});
                        audioPlayer.volume(event.data.transactionVolume);
                        audioPlayer.play();
                    }
                }
                else if (event.data.transactionType === "playLoopSound") {
                    if (audioLoopPlayer[event.data.id]) {
                        audioLoopPlayer[event.data.id].stop();
                    }
                    audioLoopPlayer[event.data.id] = new Howl({src: ["./sounds/" + event.data.transactionFile + ".ogg"], loop:true});
                    audioLoopPlayer[event.data.id].volume(event.data.transactionVolume);
                    audioLoopPlayer[event.data.id].play();
                }
                else if (event.data.transactionType === "updatevolume") {
                    audioLoopPlayer[event.data.id].volume(event.data.transactionVolume);
                }
                else if (event.data.transactionType === "stopLoopSound") {
                    if (audioLoopPlayer[event.data.id]) {
                        audioLoopPlayer[event.data.id].stop();
                        delete audioLoopPlayer[event.data.id];
                    }
                }
            });
        </script>
    </head>
</html>
