<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soz Quick Interaction DUI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        html, body, #app {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #app {
            font-family: 'Prompt', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: white
        }

        .interaction {
            border: 2px solid white;
            height: 16px;
            border-radius: 100%;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            aspect-ratio: 1/1;
        }

        .label {
            height: 23px;
            display: flex;
            overflow: hidden;
            text-wrap: nowrap;
            background: rgba(255, 255, 255, 0.5);
            padding: 0 1rem;
            border: 2px solid white;
            border-radius: 1rem;
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);

            opacity: 0;
            transform: scale(0, 1);
            transform-origin: left center;
            transition: all 500ms ease-in-out;
        }

        .label:not(:empty) {
            opacity: 1;
            transform: scale(1, 1);
        }
    </style>
    <script>
        window.addEventListener('message', function(event) {
            document.querySelector('.label').textContent = event.data.message;
        });
    </script>
</head>
<body>
<div id="app">
    <div class="interaction"></div>
    <div class="content">
        <span class="label"></span>
    </div>
</div>
</body>
</html>
